services:
  postgres-db:
    image: postgres:16-alpine
    container_name: tullave-postgres
    environment:
      POSTGRES_DB: tullave_db
      POSTGRES_USER: tullave_user
      POSTGRES_PASSWORD: tullave_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tullave_user -d tullave_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  recargas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-recargas-tullave
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: tullave_db
      DB_USER: tullave_user
      DB_PASSWORD: tullave_pass
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data: