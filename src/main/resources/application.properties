# Nombre de la aplicación
spring.application.name=recargas

# Configuración del servidor
server.port=8080

# Configuración de la Base de Datos (PostgreSQL en Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tullave_db}
spring.datasource.username=${DB_USER:tullave_user}
spring.datasource.password=${DB_PASSWORD:tullave_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect